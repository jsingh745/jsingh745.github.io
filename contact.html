<div class="container">
  <h1>Contact</h1>
  <p class="sub">
    I don’t share my phone number or personal email.
    If you’ve got real feedback about a tool, use this.
  </p>

  <div class="card">
    <span class="badge blue">Contact form</span>
    <p class="small">This form is a placeholder for now.</p>

    <form>
      <label>Your name</label>
      <input type="text" placeholder="Name">

      <label>Your email</label>
      <input type="email" placeholder="Email">

      <label>Your message</label>
      <textarea placeholder="Message"></textarea>

      <a class="btn" href="#">Send</a>
    </form>
  </div>

  <p class="note">No spam. No marketing. Weird messages get ignored.</p>
</div>
